spring.application.name=VibeWall


# Logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=WARN
logging.level.org.mongodb.driver=INFO

server.servlet.context-path=/api/v3

server.port=${SERVER_PORT:8080}

# SSL
server.ssl.enabled=false

# Redis
spring.cache.type=redis
spring.data.redis.url=${SPRING_DATA_REDIS_URL}

# MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# AI Configuration (OpenAI-compatible: Groq, OpenRouter, or Hugging Face)
hf.token=${AI_TOKEN:${HF_TOKEN:}}
hf.model=${AI_MODEL:${HF_MODEL:Qwen/Qwen2.5-72B-Instruct}}
hf.api.url=${AI_API_URL:${HF_API_URL:https://router.huggingface.co/v1/chat/completions}}

# Security
jwt.secret=${JWT_SECRET}
encryption.key=${ENCRYPTION_KEY}

# CORS
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}

# SpringDoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
