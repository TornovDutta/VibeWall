spring.application.name=VibeWall


# Logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=WARN
logging.level.org.mongodb.driver=INFO

server.servlet.context-path=/api/v3

server.port=${SERVER_PORT:8080}

# SSL
server.ssl.enabled=false

# Redis
spring.cache.type=redis
spring.data.redis.url=${SPRING_DATA_REDIS_URL}

# MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# AI (NVIDIA NIM)
nvidia.api.key=${NVDIA_API_KEY}

# Security
jwt.secret=${JWT_SECRET}
encryption.key=${ENCRYPTION_KEY}

# CORS
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}

# SpringDoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
