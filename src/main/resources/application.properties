spring.application.name=VibeWall


# Logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=WARN
logging.level.org.mongodb.driver=INFO

server.servlet.context-path=/api/v3

server.port=${SERVER_PORT:8080}

# SSL
server.ssl.enabled=false

# Redis
spring.cache.type=redis
spring.data.redis.url=${SPRING_DATA_REDIS_URL}

# MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Groq AI Configuration (Ultra-fast LPU inference)
groq.api.key=${GROQ_API_KEY:${GROQ_APIKEY:${AI_TOKEN:${groq.api.key:}}}}
groq.model=${GROQ_MODEL:${AI_MODEL:openai/gpt-oss-120b}}
groq.safeguard.model=${GROQ_SAFEGUARD_MODEL:qwen/qwen3.8-27b}
groq.api.url=${GROQ_API_URL:${AI_API_URL:https://api.groq.com/openai/v1/chat/completions}}

# Security
jwt.secret=${JWT_SECRET}
encryption.key=${ENCRYPTION_KEY}

# CORS
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}

# SpringDoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
